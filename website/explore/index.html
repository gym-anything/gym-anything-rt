<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore · Gym-Anything-RT</title>
<meta name="description" content="An interactive tour of Gym-Anything-RT: why real time matters for vision-language agents, how the minigames are built, and what the results show.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #04050a;
  --text: #eef1f7;
  --muted: #a3aabb;
  --dim: #6c7386;
  --line: rgba(255, 255, 255, 0.1);
  --glass: rgba(18, 22, 34, 0.62);
  --accent: #22d3ee;
  --violet: #a78bfa;
  --amber: #fbbf24;
  --green: #34d399;
  --red: #f87171;
  --pink: #f472b6;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 35%, #0d1326 0%, #05060c 55%, #020308 100%);
  color: var(--text); font-family: var(--font-body); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#stars { position: fixed; inset: 0; z-index: 0; }

/* ─── TOP BAR ─── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem;
  font-family: var(--font-display);
}
.topbar .home { color: var(--muted); font-weight: 500; }
.topbar .home:hover { color: var(--text); }
.crumbs { display: flex; gap: 0.4rem; align-items: center; font-size: 0.85rem; color: var(--dim); }
.crumbs button { background: none; border: 0; color: var(--muted); padding: 0.2rem 0.35rem; border-radius: 6px; }
.crumbs button:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
.crumbs .sep { opacity: 0.5; }
.toplinks { display: flex; gap: 1.25rem; font-weight: 500; }
.toplinks a { color: var(--muted); }
.toplinks a:hover { color: var(--text); }

/* ─── HUB ─── */
.scene {
  position: fixed; inset: 0; z-index: 10; perspective: 1500px; perspective-origin: 50% 45%;
  display: grid; place-items: center;
}
.world {
  position: relative; width: 0; height: 0; transform-style: preserve-3d;
  transition: transform 0.9s cubic-bezier(.2, .8, .2, 1), opacity 0.7s, filter 0.7s;
}
.scene.focus .world { transform: translateZ(-900px) translateY(-60px) !important; opacity: 0.18; filter: blur(3px); pointer-events: none; }
.core {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) translateZ(0);
  width: 560px; text-align: center; pointer-events: none;
}
.core .eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.24em; color: var(--accent); text-transform: uppercase; }
.core h1 {
  font-family: var(--font-display); font-size: 3.6rem; line-height: 1; margin: 0.9rem 0 0.8rem; letter-spacing: -0.02em;
  background: linear-gradient(120deg, #fff 20%, #9be9f5 50%, #c4b5fd 80%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.core p { color: var(--muted); font-size: 1.05rem; }
.core .hint { margin-top: 1.2rem; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
.orb {
  position: absolute; left: 0; top: 0; width: 330px; height: 330px; transform: translate(-50%, -50%) translateZ(-250px);
  border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 30%, rgba(34, 211, 238, 0.35), rgba(124, 58, 237, 0.18) 45%, transparent 70%);
  filter: blur(8px); animation: breathe 6s ease-in-out infinite;
}
@keyframes breathe { 50% { transform: translate(-50%, -50%) translateZ(-250px) scale(1.12); } }
.qcard {
  position: absolute; left: 0; top: 0; width: 230px; padding: 1rem 1.1rem;
  border-radius: 16px; border: 1px solid var(--line); background: rgba(16, 20, 32, 0.9);
  transform-style: preserve-3d; will-change: transform, opacity;
  transition: box-shadow 0.25s, border-color 0.25s, background 0.25s;
  user-select: none;
}
.qcard .icon { font-size: 1.5rem; line-height: 1; }
.qcard h3 { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.25; margin-top: 0.55rem; }
.qcard .tease { max-height: 0; overflow: hidden; opacity: 0; font-size: 0.82rem; color: var(--muted); transition: max-height 0.35s, opacity 0.3s, margin 0.3s; }
.qcard:hover, .qcard.kb { border-color: color-mix(in srgb, var(--c) 70%, transparent); background: rgba(22, 28, 44, 0.85); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 20px 60px color-mix(in srgb, var(--c) 30%, transparent); }
.qcard:hover .tease, .qcard.kb .tease { max-height: 6rem; opacity: 1; margin-top: 0.45rem; }
.qcard .go { margin-top: 0.6rem; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.12em; color: var(--c); opacity: 0; transition: opacity 0.3s; }
.qcard:hover .go, .qcard.kb .go { opacity: 1; }

/* ─── ANSWER PANEL ─── */
.stage {
  position: fixed; inset: 0; z-index: 20; display: flex; padding: 4rem 2.5vw 2.5vh;
  pointer-events: none; perspective: 1400px;
}
.panel {
  pointer-events: auto; position: relative; width: 100%; max-width: 1680px; height: 100%; margin: 0 auto;
  border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;
  background: linear-gradient(160deg, rgba(18, 23, 38, 0.97), rgba(8, 11, 19, 0.98));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent), 0 40px 140px rgba(0, 0, 0, 0.7), 0 0 120px color-mix(in srgb, var(--c) 14%, transparent);
  transform-origin: 50% 50%; display: none;
}
.panel.in { display: block; animation: flyin 0.75s cubic-bezier(.2, .9, .25, 1) both; }
.panel.out { display: block; animation: flyout 0.35s ease-in both; }
@keyframes flyin { from { opacity: 0; transform: translateZ(-700px) rotateX(18deg) rotateY(-14deg) scale(0.7); } }
@keyframes flyout { to { opacity: 0; transform: translateZ(300px) scale(1.06); filter: blur(6px); } }
.panel .scroll { height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: clamp(2rem, 4vw, 4rem) clamp(1.5rem, 4.5vw, 5rem); }
/* Text on the left is the focus. The visual sits beside it. */
.split { min-height: 100%; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(2rem, 4.5vw, 5rem); align-items: center; }
.panel .tag { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--c); }
.panel h2 { font-family: var(--font-display); font-size: clamp(2.3rem, 3.6vw, 4rem); line-height: 1.05; letter-spacing: -0.015em; margin: 0.7rem 0 1.3rem; }
.panel .answer { font-size: clamp(1.15rem, 1.4vw, 1.6rem); color: #dce1ec; line-height: 1.65; }
.panel .answer b { color: #fff; }
.visual { container-type: inline-size; min-width: 0; }
.next { margin-top: 2.2rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }
.next .label { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; margin-bottom: 0.8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.05rem; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.04);
  font-family: var(--font-display); font-weight: 600; font-size: 0.95rem;
  opacity: 0; transform: translateY(14px) scale(0.92); animation: pop 0.45s cubic-bezier(.2, .9, .3, 1.3) forwards;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.chip:hover { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, transparent); box-shadow: 0 8px 30px color-mix(in srgb, var(--cc) 30%, transparent); }
@keyframes pop { to { opacity: 1; transform: none; } }
.close {
  position: absolute; top: 1rem; right: 1rem; z-index: 2;
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(10, 13, 22, 0.85);
  font-size: 1.1rem;
}
.close:hover { border-color: #fff; }

/* ─── VISUAL BUILDING BLOCKS ─── */
.row { display: grid; gap: 1rem; }
.row.three { grid-template-columns: repeat(3, 1fr); }
.row.two { grid-template-columns: 1fr 1fr; }
.tile {
  border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); padding: 1.1rem 1.2rem;
  opacity: 0; transform: translateY(16px); animation: pop 0.6s cubic-bezier(.2, .9, .3, 1) forwards;
}
.tile .k { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.tile .big { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; line-height: 1.1; margin-top: 0.3rem; }
.tile p { color: var(--muted); font-size: 0.9rem; margin-top: 0.35rem; }
.tile .emoji { font-size: 1.8rem; }
canvas.demo { width: 100%; display: block; border-radius: 14px; border: 1px solid var(--line); background: #070a12; cursor: crosshair; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-top: 0.8rem; }
.seg { display: inline-flex; max-width: 100%; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.14); overflow-x: auto; scrollbar-width: none; }
.seg button { padding: 0.55rem 1rem; border: 0; background: transparent; font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--accent); color: #031318; }
.readout { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
.readout b { color: var(--text); }
.bars { display: grid; gap: 0.7rem; }
.bar-row { display: grid; grid-template-columns: 11rem 1fr; align-items: center; gap: 1rem; }
.bar-row .name { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
.bar-track { position: relative; height: 26px; border-radius: 7px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
.bar-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 7px; transition: width 1.1s cubic-bezier(.2, .9, .2, 1); display: flex; align-items: center; justify-content: flex-end; padding-right: 0.5rem; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; color: #04121a; white-space: nowrap; }
.bar-fill.rt { background: linear-gradient(90deg, #0e7490, #22d3ee); }
.bar-fill.nrt { background: linear-gradient(90deg, #6d28d9, #a78bfa); height: 50%; top: 50%; opacity: 0.9; }
.bar-fill.human { background: linear-gradient(90deg, #059669, #34d399); }
/* Small values are labelled just past the end of their bar so the number stays readable. */
.bar-out { position: absolute; top: 0; height: 50%; display: flex; align-items: center; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; color: #67e8f9; }
.legend { display: flex; gap: 1.2rem; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.9rem; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 0.4rem; vertical-align: -1px; }
.slider-wrap { display: grid; grid-template-columns: 1fr 15rem; gap: 1.5rem; align-items: center; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; }
.meter { text-align: center; }
.meter .val { font-family: var(--font-display); font-size: 4.2rem; font-weight: 700; line-height: 1; color: var(--accent); text-shadow: 0 0 40px rgba(34, 211, 238, 0.4); }
.meter p { color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; }
.loop { position: relative; height: 300px; }
.loop svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node {
  position: absolute; width: min(210px, 42%); padding: 1rem; border-radius: 14px; text-align: center;
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); transition: all 0.4s;
}
.node.on { border-color: var(--nc); box-shadow: 0 0 0 1px var(--nc), 0 10px 40px color-mix(in srgb, var(--nc) 35%, transparent); background: color-mix(in srgb, var(--nc) 10%, transparent); }
.node .emoji { font-size: 2rem; }
.node b { display: block; font-family: var(--font-display); margin-top: 0.3rem; }
.node small { color: var(--muted); font-size: 0.8rem; }
.loop-caption { text-align: center; margin-top: 0.8rem; font-size: 1rem; color: var(--text); min-height: 1.6em; }
.pipeline { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: 0.8rem; }
.pipeline .arrow { align-self: center; font-size: 1.6rem; color: var(--dim); animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(5px); color: var(--accent); } }
.counter { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.7rem; font-family: var(--font-display); }
.counter .term { padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); text-align: center; opacity: 0; animation: pop 0.5s forwards; }
.counter .term b { display: block; font-size: 1.9rem; }
.counter .term small { color: var(--muted); font-size: 0.75rem; }
.counter .op { font-size: 1.6rem; color: var(--dim); opacity: 0; animation: pop 0.5s forwards; }
.counter .total b { color: var(--accent); }
.capchips { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
.capchip { padding: 0.55rem 0.85rem; border-radius: 10px; border: 1px solid currentColor; font-size: 0.88rem; opacity: 0; animation: pop 0.5s forwards; }
.capchip b { font-family: var(--font-display); margin-right: 0.35rem; }
video.clip { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; background: #000; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.vs .who { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem; font-family: var(--font-display); font-weight: 600; }
.vs .who span { font-family: var(--font-mono); font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 6px; }
.win { color: var(--green); background: rgba(52, 211, 153, 0.12); }
.lose { color: var(--red); background: rgba(248, 113, 113, 0.12); }
.mosaic { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
.mosaic video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 1.2rem; padding: 0.95rem 1.8rem; border-radius: 12px;
  background: linear-gradient(135deg, #22d3ee, #0891b2); color: #031318; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
  box-shadow: 0 10px 40px rgba(34, 211, 238, 0.35);
}
.cta:hover { transform: translateY(-1px); }

/* Visuals adapt to the width they are given, beside the text or below it. */
@container (max-width: 620px) {
  .row.three, .row.two, .vs, .pipeline, .slider-wrap { grid-template-columns: 1fr; }
  .pipeline .arrow { transform: rotate(90deg); justify-self: center; animation: none; }
  .bar-row, .bar-row[style] { grid-template-columns: 7.5rem 1fr !important; gap: 0.6rem; }
  .bar-row .name { font-size: 0.82rem; }
  .mosaic { grid-template-columns: 1fr 1fr; }
  .node { padding: 0.7rem; }
  .node small { font-size: 0.72rem; }
  .tile .big { font-size: 1.9rem; }
}

/* Narrow screens: the text and the visual stack, and the follow-ups come last. */
@media (max-width: 1099px) {
  .split { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 0; }
  .split .text { display: contents; }
  .split .visual { order: 1; margin-top: 1.8rem; }
  .split .next { order: 2; margin-top: 2rem; }
  .panel h2 { padding-right: 2.5rem; }
}

/* Phones: the ring becomes a vertical drum you swipe. */
@media (max-width: 759px) {
  .toplinks { display: none; }
  .topbar { padding: 0.8rem 1rem; }
  .crumbs .sep, .crumbs button:not(:first-child) { display: none; }
  /* Look at the drum from its own height so cards below the middle still face the viewer. */
  .scene { perspective: 760px; perspective-origin: 50% calc(50% + var(--drum-y, 0px)); touch-action: none; }
  .core { width: 92vw; top: var(--core-y, 0px); transform: translate(-50%, 0); }
  .core h1 { font-size: 2.3rem; margin: 0.6rem 0; }
  .core p { font-size: 0.95rem; }
  .core .hint { margin-top: 0.8rem; }
  .orb { top: var(--drum-y, 0px); width: 260px; height: 260px; }
  .qcard {
    width: min(86vw, 380px); padding: 0.8rem 1rem; backface-visibility: hidden;
    display: grid; grid-template-columns: auto 1fr; column-gap: 0.8rem; align-items: center;
  }
  .qcard h3 { margin-top: 0; font-size: 1rem; }
  .qcard .tease, .qcard .go { grid-column: 1 / -1; }
  .qcard.front { border-color: color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 16px 50px color-mix(in srgb, var(--c) 30%, transparent); }
  .qcard.front .tease { max-height: 4rem; opacity: 1; margin-top: 0.4rem; }
  .qcard.front .go { opacity: 1; margin-top: 0.4rem; }
  .stage { padding: 3.4rem 0.5rem 0.5rem; }
  .panel { border-radius: 18px; }
  .panel .scroll { padding: 1.6rem 1.2rem 1.4rem; }
  .close { top: 0.7rem; right: 0.7rem; width: 40px; height: 40px; }
  .chip { font-size: 0.9rem; padding: 0.6rem 0.9rem; }
}
.hint .touch { display: none; }
@media (hover: none) { .hint .mouse { display: none; } .hint .touch { display: inline; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header class="topbar">
  <a class="home" href="../">← Gym-Anything-RT</a>
  <nav class="crumbs" id="crumbs"></nav>
  <nav class="toplinks">
    <a href="../arcade/">Arcade</a>

</header>

<div class="scene" id="scene">
  <div class="world" id="world">
    <div class="orb"></div>
    <div class="core">
      <div class="eyebrow">Explore</div>
      <h1>Gym-Anything-RT</h1>
      <p>The world keeps moving while an agent thinks.<br>Pick a question to explore.</p>
      <div class="hint"><span class="mouse">Hover a card · drag to spin · click to fly in</span><span class="touch">Swipe to spin · tap a card</span></div>
    </div>
  </div>
</div>

<div class="stage" id="stage">

<script>
// ═══════════════════════════════════════════════════════════════
// CONTENT. Every number below comes from the paper.
// ═══════════════════════════════════════════════════════════════
const Q = {
  about: {
    icon: '🧭', color: '#22d3ee', q: 'What is this paper about?',
    tease: 'Measuring agents in worlds that do not wait for them.',
    answer: `Video games and physical devices keep changing while an agent thinks. Today's vision-language agents take <b>several seconds</b> for every action, so in these settings the world has moved on before they act. Gym-Anything-RT measures this. Coding agents build <b>100 real-time minigames</b>, and our evaluation stack controls each minigame's clock, so the same task can be played live, slowed down, or paused.`,
    visual: 'about', next: ['why', 'minigame', 'results'],
  },
  why: {
    icon: '⏱️', color: '#fbbf24', q: 'Why does real time matter?',
    tease: 'Try clicking a moving target with a model\'s delay.',
    answer: `A model sees a screenshot, reasons for a few seconds, then acts on what it saw. If the target moved in the meantime, the action misses. Try it yourself. In <b>Model</b> mode your click is applied 4 seconds later, the way a frontier model's would be.`,
    visual: 'latency', next: ['time', 'fail', 'examples'],
  },
  minigame: {
    icon: '🎮', color: '#f472b6', q: 'What is a minigame?',
    tease: 'A small visual game that isolates real-time skills.',
    answer: `Each minigame is a small browser game that demands a mix of real-time skills without the complexity of a full video game. In <b>Rotating On-Screen Keyboard</b>, the agent types a code by clicking keys that keep turning in 3D between its observation and its action. Every minigame comes with a generator, a grader, an oracle solver, five difficulty levels, and two interaction modes.`,
    visual: 'minigame', next: ['build', 'play', 'results'],
  },
  build: {
    icon: '🛠️', color: '#a78bfa', q: 'How were 100 games built?',
    tease: 'Coding agents create them, other agents audit them.',
    answer: `A <b>creator agent</b> turns a source idea into a real-time minigame program, with an oracle solution that shows the task is solvable. Independent <b>auditor agents</b>, who never see the creator's reasoning, test the game and its evidence and send problems back until an audit passes. Each minigame also gets a <b>non-real-time counterpart</b>, and an auditor checks that the two differ only in timing.`,
    visual: 'loop', next: ['minigame', 'time', 'play'],
  },
  time: {

// ═══════════════════════════════════════════════════════════════
const starCanvas = document.getElementById('stars');
const DPR = Math.min(devicePixelRatio, 1.5);
const sctx = starCanvas.getContext('2d');
let stars = [], warp = 0, mouse = { x: 0, y: 0 };
function resizeStars() {
  starCanvas.width = innerWidth * DPR;
  starCanvas.height = innerHeight * DPR;
  stars = Array.from({ length: 380 }, () => ({ x: (Math.random() - 0.5) * 2, y: (Math.random() - 0.5) * 2, z: Math.random() }));
}
function drawStars() {
  const w = starCanvas.width, h = starCanvas.height;
  sctx.fillStyle = 'rgba(2, 3, 8, 0.38)';
  sctx.fillRect(0, 0, w, h);
  const speed = 0.0009 + warp * 0.03;
  warp *= 0.95;
  for (const s of stars) {
    const pz = s.z;
    s.z -= speed;
    if (s.z <= 0.02) { s.x = (Math.random() - 0.5) * 2; s.y = (Math.random() - 0.5) * 2; s.z = 1; continue; }
    const k = 0.5 / s.z;
    const ox = mouse.x * 40 * DPR * (1 - s.z), oy = mouse.y * 40 * DPR * (1 - s.z);
    const x = w / 2 + s.x * k * w * 0.5 + ox, y = h / 2 + s.y * k * h * 0.5 + oy;
    const px = w / 2 + s.x * (0.5 / pz) * w * 0.5 + ox, py = h / 2 + s.y * (0.5 / pz) * h * 0.5 + oy;
    const a = Math.min(1, (1 - s.z) * 1.4);
    sctx.strokeStyle = `rgba(${180 + 60 * (1 - s.z)}, ${220}, 255, ${a})`;
    sctx.lineWidth = (1 - s.z) * 2.2 * DPR;
    sctx.beginPath(); sctx.moveTo(px, py); sctx.lineTo(x, y); sctx.stroke();
  }
  requestAnimationFrame(drawStars);
}
addEventListener('resize', resizeStars);
resizeStars(); drawStars();

// 3D RING OF QUESTION CARDS
// ═══════════════════════════════════════════════════════════════
const world = document.getElementById('world');
const scene = document.getElementById('scene');
const cards = [];
let spin = 0, spinVel = 0.0016, hovering = false, drag = null, kbIndex = -1, touched = false;
const STEP = (Math.PI * 2) / ORDER.length;
const phone = () => innerWidth < 760;
const drum = { y: 0, r: 150 };

ORDER.forEach((key, i) => {
  const item = Q[key];
  const card = document.createElement('div');
  card.className = 'qcard';
  card.style.setProperty('--c', item.color);
  card.innerHTML = `<div class="icon">${item.icon}</div><h3>${item.q}</h3><div class="tease">${item.tease}</div><div class="go">${matchMedia('(hover: none)').matches ? 'TAP' : 'CLICK'} TO EXPLORE →</div>`;
  card.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') hovering = true; });
  card.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hovering = false; });
  card.addEventListener('click', () => { if (!drag || !drag.moved) open(key); });
  world.append(card);
  cards.push({ el: card, key, i });
});

// On phones the title sits at the top and the drum fills the space below it.
function placePhone() {
  const core = world.querySelector('.core');
  const h = scene.clientHeight;
  const coreTop = -h / 2 + 64;
  scene.style.setProperty('--core-y', `${coreTop}px`);
  const below = coreTop + core.offsetHeight;
  const room = h / 2 - below - 24;
  drum.r = Math.max(110, Math.min(190, room / 2 - 30));
  drum.y = below + room / 2;
  scene.style.setProperty('--drum-y', `${drum.y}px`);
}
addEventListener('resize', placePhone);
placePhone();

function layoutDrum() {
  let front = null, best = -2;
  for (const c of cards) {
    // Wrap the angle to [-π, π] so the drum turns smoothly in both directions.
    const a = Math.atan2(Math.sin(spin + c.i * STEP), Math.cos(spin + c.i * STEP));
    const facing = Math.cos(a);
    const y = drum.y + Math.sin(a) * drum.r;
    const z = (facing - 1) * drum.r;
    c.el.style.transform = `translate(-50%, -50%) translate3d(0, ${y}px, ${z}px) rotateX(${-a}rad)`;
    c.el.style.opacity = facing > 0 ? (0.2 + facing * 0.8).toFixed(3) : 0;
    c.el.style.pointerEvents = facing > 0.3 ? 'auto' : 'none';
    c.el.style.zIndex = Math.round(facing * 100) + 100;
    c.el.style.filter = 'none';
    if (facing > best) { best = facing; front = c; }
  }
  cards.forEach(c => c.el.classList.toggle('front', c === front));
}

function layout() {
  if (phone()) return layoutDrum();
  cards.forEach(c => c.el.classList.remove('front'));
  const n = cards.length;
  const R = Math.min(600, innerWidth * 0.36);
  // The orbit is tilted: cards pass below the title in front and above it behind.
  const ry = Math.min(250, innerHeight * 0.29);
  for (const c of cards) {
    c.el.style.pointerEvents = '';
    const a = spin + (c.i / n) * Math.PI * 2;
    const x = Math.sin(a) * R;
    const z = Math.cos(a) * R * 0.75;
    const y = Math.cos(a) * ry;
    const depth = (z / (R * 0.75) + 1) / 2;
    const hovered = c.el.matches(':hover') || c.el.classList.contains('kb');
    const s = (0.62 + depth * 0.5) * (hovered ? 1.18 : 1);
    c.el.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, ${z}px) rotateY(${-Math.sin(a) * 18}deg) scale(${s})`;
    c.el.style.opacity = (0.28 + depth * 0.72).toFixed(3);
    c.el.style.zIndex = Math.round(depth * 100) + (hovered ? 200 : 0);
    c.el.style.filter = depth < 0.35 ? `blur(${(0.35 - depth) * 6}px)` : 'none';
  }
}
let lastTick = performance.now();
function tick() {
  // Spin by elapsed time so the speed does not depend on the frame rate.
  const t = performance.now();
  const frames = Math.max(0, Math.min(4, (t - lastTick) / 16.7));
  lastTick = t;
  const opened = document.body.classList.contains('opened');
  if (phone() && touched) {
    // After a swipe the drum coasts, then settles on the nearest card.
    if (!drag && !opened) {
      spinVel *= Math.pow(0.93, frames);
      spin += spinVel * frames;
      if (Math.abs(spinVel) < 0.01) spin += (Math.round(spin / STEP) * STEP - spin) * Math.min(1, 0.12 * frames);
    }
  } else {
    if (!drag && !hovering && !opened) spin += spinVel * frames;
    if (!drag) spinVel += (0.0016 - spinVel) * 0.02 * frames;
  }
  layout();
  if (!opened) {
    world.style.transform = `rotateX(${-mouse.y * 6}deg) rotateY(${mouse.x * 8}deg)`;
  }
  requestAnimationFrame(tick);
}
addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') {
    mouse.x = e.clientX / innerWidth - 0.5;
    mouse.y = e.clientY / innerHeight - 0.5;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.dist += Math.abs(dx) + Math.abs(dy);
  if (drag.dist > 8) drag.moved = true;
  // Phones turn the drum with a vertical swipe. Wider screens spin the ring sideways.
  spinVel = phone() ? dy / drum.r : dx * 0.0009;
  spin += spinVel;
  drag.x = e.clientX;
  drag.y = e.clientY;
});
scene.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, dist: 0, moved: false }; touched = true; });
const release = () => { setTimeout(() => { drag = null; }, 0); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
scene.addEventListener('wheel', e => { spinVel = Math.max(-0.03, Math.min(0.03, spinVel + e.deltaY * 0.00004)); }, { passive: true });
tick();

// ANSWER PANEL
// ═══════════════════════════════════════════════════════════════
const panel = document.getElementById('panel');
let trail = [], cleanup = [];

function renderCrumbs() {
  const nav = document.getElementById('crumbs');
  nav.replaceChildren();
  const home = document.createElement('button');
  home.textContent = '✦ All questions';
  home.onclick = closePanel;
  nav.append(home);
  trail.forEach((key, idx) => {
    const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '›';
    const b = document.createElement('button');
    b.textContent = Q[key].q;
    b.onclick = () => { trail = trail.slice(0, idx); open(key); };
    nav.append(sep, b);
  });
  nav.style.visibility = trail.length ? 'visible' : 'hidden';
}

function open(key) {
  const item = Q[key];
  warp = 1;
  cleanup.forEach(fn => fn()); cleanup = [];
  if (trail[trail.length - 1] !== key) trail.push(key);
  if (trail.length > 6) trail = trail.slice(-6);
  renderCrumbs();
  scene.classList.add('focus');
  document.body.classList.add('opened');
  history.replaceState(null, '', `#${key}`);
  const show = () => {
    panel.className = 'panel';
    panel.style.setProperty('--c', item.color);
    panel.innerHTML = `
      <button class="close" aria-label="Back to all questions">✕</button>
      <div class="scroll"><div class="split">
        <div class="text">
          <div class="tag">${item.icon} Question ${ORDER.indexOf(key) + 1} of ${ORDER.length}</div>
          <h2>${item.q}</h2>
          <p class="answer">${item.answer}</p>
          <div class="next"><div class="label">Ask next</div><div class="chips" id="chips"></div></div>
        </div>
        <div class="visual" id="visual"></div>
      </div></div>`;
    panel.querySelector('.close').onclick = closePanel;
    VISUALS[item.visual](panel.querySelector('#visual'));
    const chips = panel.querySelector('#chips');
    item.next.forEach((nk, idx) => {
      const c = document.createElement('button');
      c.className = 'chip';
      c.style.setProperty('--cc', Q[nk].color);
      c.style.animationDelay = `${0.5 + idx * 0.12}s`;
      c.innerHTML = `<span>${Q[nk].icon}</span>${Q[nk].q}`;
      c.onclick = () => open(nk);
      chips.append(c);
    });
    void panel.offsetWidth;
    panel.classList.add('in');
  };
  if (panel.classList.contains('in')) {
    panel.classList.replace('in', 'out');
    setTimeout(show, 330);
  } else show();
}

function closePanel() {
  cleanup.forEach(fn => fn()); cleanup = [];
  trail = [];
  renderCrumbs();
  warp = 0.6;
  panel.classList.replace('in', 'out');
  setTimeout(() => { panel.className = 'panel'; panel.innerHTML = ''; }, 340);
  scene.classList.remove('focus');
  document.body.classList.remove('opened');
  history.replaceState(null, '', location.pathname);
}

addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('opened')) closePanel();
  if (document.body.classList.contains('opened')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    kbIndex = (kbIndex + (e.key === 'ArrowRight' ? 1 : -1) + cards.length) % cards.length;
    cards.forEach((c, i) => c.el.classList.toggle('kb', i === kbIndex));
    spin = -(kbIndex / cards.length) * Math.PI * 2;
  }
  if (e.key === 'Enter' && kbIndex >= 0) open(cards[kbIndex].key);
});

const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; };
const loop = (fn) => { let on = true; const f = () => { if (!on) return; fn(performance.now()); requestAnimationFrame(f); }; requestAnimationFrame(f); cleanup.push(() => { on = false; }); };
const delay = (i) => `style="animation-delay:${0.25 + i * 0.12}s"`;
// Size a canvas to its width on screen and draw in CSS pixels, so text and targets stay readable on any screen.
const fitCanvas = (cv, height) => {
  const fit = () => {
    const w = cv.clientWidth, d = Math.min(devicePixelRatio || 1, 2);
    if (!w) return;
    const hh = height(w);
    cv.style.height = `${hh}px`;
    cv.width = Math.round(w * d); cv.height = Math.round(hh * d);
    cv.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  };
  const ro = new ResizeObserver(fit);
  ro.observe(cv);
  cleanup.push(() => ro.disconnect());
  return () => ({ W: cv.clientWidth, H: cv.clientHeight });
};

const VISUALS = {
  about(root) {
    root.append(h(`
      <div class="pipeline">
        <div class="tile" ${delay(0)}><div class="emoji">🧩</div><div class="k" style="margin-top:.5rem">Build</div><p>Coding agents turn source ideas into <b style="color:#fff">100 real-time minigames</b>, each with a non-real-time counterpart.</p></div>
        <div class="arrow">→</div>
        <div class="tile" ${delay(1)}><div class="emoji">🕰️</div><div class="k" style="margin-top:.5rem">Control the clock</div><p>Run the same task <b style="color:#fff">live</b>, <b style="color:#fff">slowed down</b>, or <b style="color:#fff">paused</b> between observation and action.</p></div>
        <div class="arrow">→</div>
        <div class="tile" ${delay(2)}><div class="emoji">🔬</div><div class="k" style="margin-top:.5rem">Compare</div><p>If an agent passes when paused but fails live, it fails because it <b style="color:#fff">cannot act in time</b>.</p></div>
      </div>
      <div class="row three" style="margin-top:1rem">
        <div class="tile" ${delay(3)}><div class="k">Minigames</div><div class="big" style="color:var(--accent)">100</div><p>2,000 configurations in total</p></div>
        <div class="tile" ${delay(4)}><div class="k">Best model, live</div><div class="big" style="color:var(--red)">9%</div><p>GPT-6 Astra (xHigh)</p></div>
        <div class="tile" ${delay(5)}><div class="k">Same model, paused</div><div class="big" style="color:var(--green)">75%</div><p>Same tasks, clock frozen while it thinks</p></div>
      </div>`));
  },

  latency(root) {
    root.append(h(`
      <canvas class="demo" id="lat"></canvas>
      <div class="controls">
        <div class="seg" id="lat-mode"><button data-m="you" class="on">🧑 You (instant)</button><button data-m="model">🤖 Model (4 s delay)</button></div>
        <span class="readout" id="lat-score">Click the moving orb.</span>
      </div>`));
    const cv = root.querySelector('#lat'), ctx = cv.getContext('2d');
    const size = fitCanvas(cv, w => Math.round(Math.max(280, Math.min(400, w * 0.45))));
    let mode = 'you', hits = 0, tries = 0, pending = [], flashes = [];
    const t0 = performance.now();
    const pos = (t) => {
      const { W, H } = size();
      return { x: W / 2 + Math.sin(t * 0.0011) * W * 0.36 + Math.sin(t * 0.0029) * W * 0.05, y: H / 2 + Math.sin(t * 0.0017 + 1) * H * 0.32 };
    };
    let R = 26;
    root.querySelectorAll('#lat-mode button').forEach(b => b.onclick = () => {
      mode = b.dataset.m; hits = 0; tries = 0; pending = [];
      root.querySelectorAll('#lat-mode button').forEach(x => x.classList.toggle('on', x === b));
      score();
    });
    const score = (msg) => { root.querySelector('#lat-score').innerHTML = msg || `Hits <b>${hits}</b> of <b>${tries}</b>${mode === 'model' ? ' · each click lands 4 s later' : ''}`; };
    cv.addEventListener('click', e => {
      const r = cv.getBoundingClientRect();
      const { W, H } = size();
      const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
      const now = performance.now();
      if (mode === 'you') {
        const p = pos(now - t0); tries++;
        const hit = Math.hypot(p.x - x, p.y - y) < R + 8;
        if (hit) hits++;
        flashes.push({ x, y, hit, t: now });
        score();
      } else {
        pending.push({ x, y, t: now, seen: pos(now - t0) });
        score('🤖 Thinking… the orb keeps moving.');
      }
    });
    loop((now) => {
      const t = now - t0;
      const { W, H } = size();
      R = Math.max(20, Math.min(26, W * 0.03));
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
      for (let gx = 0; gx < W; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      for (let gy = 0; gy < H; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
      for (let k = 18; k > 0; k--) { const p = pos(t - k * 30); ctx.fillStyle = `rgba(34,211,238,${0.012 * (18 - k)})`; ctx.beginPath(); ctx.arc(p.x, p.y, R * (1 - k / 30), 0, 7); ctx.fill(); }
      const p = pos(t);
      const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, R * 1.8);
      g.addColorStop(0, '#a5f3fc'); g.addColorStop(0.45, '#22d3ee'); g.addColorStop(1, 'rgba(34,211,238,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, R * 1.8, 0, 7); ctx.fill();
      pending = pending.filter(c => {
        const age = now - c.t;
        if (age >= 4000) {
          tries++;
          const hit = Math.hypot(p.x - c.x, p.y - c.y) < R + 8;
          if (hit) hits++;
          flashes.push({ x: c.x, y: c.y, hit, t: now, ghost: c.seen });
          score();
          return false;
        }
        ctx.strokeStyle = 'rgba(251,191,36,0.9)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(c.x, c.y, 18, -Math.PI / 2, -Math.PI / 2 + (age / 4000) * Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#fbbf24'; ctx.font = '600 15px JetBrains Mono'; ctx.textAlign = 'center';
        ctx.fillText(`${((4000 - age) / 1000).toFixed(1)}s`, c.x, c.y - 28);
        return true;
      });
      flashes = flashes.filter(f => {
        const age = now - f.t; if (age > 1600) return false;
        const a = 1 - age / 1600;
        if (f.ghost) {
          ctx.setLineDash([5, 5]); ctx.strokeStyle = `rgba(255,255,255,${0.5 * a})`; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(f.ghost.x, f.ghost.y, R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = `rgba(255,255,255,${0.7 * a})`; ctx.font = '500 13px Inter'; ctx.textAlign = 'center';
          ctx.fillText('where it was', f.ghost.x, f.ghost.y + R + 18);
        }
        ctx.strokeStyle = f.hit ? `rgba(52,211,153,${a})` : `rgba(248,113,113,${a})`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(f.x, f.y, 14 + age / 40, 0, 7); ctx.stroke();
        ctx.fillStyle = f.hit ? `rgba(52,211,153,${a})` : `rgba(248,113,113,${a})`; ctx.font = '700 18px Space Grotesk'; ctx.textAlign = 'center';
        ctx.fillText(f.hit ? 'HIT' : 'MISS', f.x, f.y - 26 - age / 50);
        return true;
      });
    });
  },

  minigame(root) {
    root.append(h(`
      <div class="row two">

          <div class="counter">
            <div class="term" style="animation-delay:.3s"><b>100</b><small>minigames</small></div><div class="op" style="animation-delay:.4s">×</div>
            <div class="term" style="animation-delay:.5s"><b>2</b><small>real time and<br>counterpart</small></div><div class="op" style="animation-delay:.6s">×</div>
            <div class="term" style="animation-delay:.7s"><b>5</b><small>difficulty<br>levels</small></div><div class="op" style="animation-delay:.8s">×</div>
            <div class="term" style="animation-delay:.9s"><b>2</b><small>interaction<br>modes</small></div><div class="op" style="animation-delay:1s">=</div>
            <div class="term total" style="animation-delay:1.15s"><b id="cfg">0</b><small>configurations</small></div>
          </div>
          <div class="k" style="font-family:var(--font-mono);font-size:.7rem;letter-spacing:.16em;color:var(--dim);margin-top:1.3rem">CAPABILITIES THE REAL-TIME MINIGAMES REQUIRE</div>
          <div class="capchips">
            <span class="capchip" style="color:var(--accent);animation-delay:1.3s"><b>100</b>Temporal reasoning</span>
            <span class="capchip" style="color:var(--amber);animation-delay:1.4s"><b>96</b>Reasoning and planning</span>
            <span class="capchip" style="color:var(--green);animation-delay:1.5s"><b>52</b>Exploration</span>
            <span class="capchip" style="color:var(--violet);animation-delay:1.6s"><b>31</b>3D understanding</span>
          </div>
        </div>
      </div>`));
    const el = root.querySelector('#cfg');
    const start = performance.now() + 1150;
    loop(now => { const k = Math.max(0, Math.min(1, (now - start) / 900)); el.textContent = Math.round(2000 * (1 - Math.pow(1 - k, 3))).toLocaleString(); });
  },

  loop(root) {
    root.append(h(`
      <div class="loop" id="loopbox">
        <svg viewBox="0 0 1000 300" preserveAspectRatio="none">
          <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c7386"/></marker></defs>
          <path id="p1" d="M 300 105 C 430 30, 570 30, 700 105" stroke="#6c7386" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#ah)"/>
          <path id="p2" d="M 700 195 C 570 270, 430 270, 300 195" stroke="#6c7386" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#ah)"/>
          <circle id="dot" r="8" fill="#a78bfa"/>
        </svg>
        <div class="node" id="n-creator" style="left:4%;top:85px;--nc:#a78bfa"><div class="emoji">🧑‍💻</div><b>Creator agent</b><small>Builds the game, generator, grader and oracle solver</small></div>
        <div class="node" id="n-audit" style="right:4%;top:85px;--nc:#fbbf24"><div class="emoji">🕵️</div><b>Auditor agents</b><small>Fresh sessions test the game and its evidence</small></div>
        <div class="node" id="n-pass" style="left:50%;top:0;transform:translateX(-50%);width:170px;padding:.6rem;--nc:#34d399;opacity:.35"><b>✅ Audit passes</b></div>
      </div>
      <div class="loop-caption" id="loopcap"></div>`));
    const steps = [
      ['n-creator', 'p1', 'The creator implements the minigame and records evidence that it works.'],
      ['n-audit', 'p2', 'Auditors explore the repository and write a report of problems.'],
      ['n-creator', 'p1', 'The creator fixes every issue and sends it back for a new audit.'],
      ['n-pass', null, 'The loop repeats until an audit passes.'],
    ];
    const dot = root.querySelector('#dot');
    const start = performance.now();
    loop(now => {
      const t = (now - start) / 2200;
      const k = Math.floor(t) % steps.length, f = t % 1;
      const [node, path, cap] = steps[k];
      root.querySelectorAll('.node').forEach(n => n.classList.toggle('on', n.id === node));
      root.querySelector('#n-pass').style.opacity = node === 'n-pass' ? 1 : 0.35;
      root.querySelector('#loopcap').textContent = cap;
      if (path) {
        const p = root.querySelector('#' + path), L = p.getTotalLength(), pt = p.getPointAtLength(f * L);
        dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); dot.setAttribute('opacity', 1);
        dot.setAttribute('fill', path === 'p1' ? '#a78bfa' : '#fbbf24');
      } else dot.setAttribute('opacity', 0);
    });
  },

  clock(root) {
    root.append(h(`
      <canvas class="demo" id="clk" style="cursor:default"></canvas>
      <div class="controls">
        <div class="seg" id="clk-mode"><button data-m="live" class="on">▶ Live</button><button data-m="slow">🐌 Slowed 16×</button><button data-m="paused">⏸ Paused</button></div>
        <span class="readout" id="clk-read"></span>
      </div>`));
    const cv = root.querySelector('#clk'), ctx = cv.getContext('2d');
    const radius = (W) => (W >= 560 ? Math.min(120, W * 0.14) : Math.min(72, W * 0.2));
    const size = fitCanvas(cv, W => Math.round(radius(W) * 2 + 150));
    let mode = 'live', world = 0, last = performance.now(), phaseStart = last, snap = 0, result = null;
    const OBS = 600, THINK = 3200, SHOW = 1400, SPEED = 1.6;
    root.querySelectorAll('#clk-mode button').forEach(b => b.onclick = () => {
      mode = b.dataset.m; result = null; phaseStart = performance.now();
      root.querySelectorAll('#clk-mode button').forEach(x => x.classList.toggle('on', x === b));
    });
    const dial = (cx, cy, r, ang, label, col, ghost) => {
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
      for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r - 8), cy + Math.sin(a) * (r - 8)); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke(); }
      if (ghost != null) { ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(251,191,36,0.8)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ghost) * r * 0.85, cy + Math.sin(ghost) * r * 0.85); ctx.stroke(); ctx.setLineDash([]); }
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(4, r * 0.05); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * r * 0.85, cy + Math.sin(ang) * r * 0.85); ctx.stroke();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * r * 0.85, cy + Math.sin(ang) * r * 0.85, Math.max(7, r * 0.1), 0, 7); ctx.fill();
      ctx.fillStyle = '#a3aabb'; ctx.font = `600 ${r > 90 ? 15 : 12}px JetBrains Mono`; ctx.textAlign = 'center'; ctx.fillText(label, cx, cy + r + 28);
    };
    loop(now => {
      const dt = now - last; last = now;
      const age = now - phaseStart;
      const phase = age < OBS ? 'observe' : age < OBS + THINK ? 'think' : age < OBS + THINK + SHOW ? 'act' : 'reset';
      if (phase === 'reset') { phaseStart = now; result = null; }
      let rate = 1;
      if (phase === 'think') rate = mode === 'live' ? 1 : mode === 'slow' ? 1 / 16 : 0;
      if (phase === 'act') rate = 0;
      world += dt / 1000 * SPEED * rate;
      if (phase === 'observe') snap = world;
      if (phase === 'act' && result === null) { const d = Math.abs(((world - snap) * 180 / Math.PI + 540) % 360 - 180); result = d; }
      const { W, H } = size(), r = radius(W), wide = W >= 560, cy = r + 22;
      ctx.clearRect(0, 0, W, H);
      dial(W * 0.28, cy, r, snap, wide ? 'WHAT THE MODEL SAW' : 'MODEL SAW', '#fbbf24');
      dial(W * 0.72, cy, r, world, wide ? 'THE WORLD NOW' : 'WORLD NOW', '#22d3ee', phase === 'act' ? snap : null);
      const bx = wide ? W * 0.18 : 16, barW = W - 2 * bx, by = H - 30;
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(bx, by, barW, 8);
      const tot = OBS + THINK + SHOW, prog = Math.min(1, age / tot);
      ctx.fillStyle = '#22d3ee'; ctx.fillRect(bx, by, barW * OBS / tot, 8);
      ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + barW * OBS / tot, by, barW * THINK / tot, 8);
      ctx.fillStyle = '#34d399'; ctx.fillRect(bx + barW * (OBS + THINK) / tot, by, barW * SHOW / tot, 8);
      ctx.fillStyle = '#fff'; ctx.fillRect(bx + barW * prog - 2, by - 6, 4, 20);
      ctx.font = `600 ${wide ? 14 : 11}px JetBrains Mono`; ctx.textAlign = 'center';
      ctx.fillStyle = '#22d3ee'; ctx.fillText(wide ? 'observe' : 'see', bx + barW * OBS / tot / 2, by - 12);
      ctx.fillStyle = '#fbbf24'; ctx.fillText('model thinks', bx + barW * (OBS + THINK / 2) / tot, by - 12);
      ctx.fillStyle = '#34d399'; ctx.fillText('acts', bx + barW * (OBS + THINK + SHOW / 2) / tot, by - 12);
      const read = root.querySelector('#clk-read');
      if (phase === 'act') read.innerHTML = result < 8 ? `<b style="color:var(--green)">On target.</b> The world waited.` : `<b style="color:var(--red)">Off by ${Math.round(result)}°.</b> The world moved while the model thought.`;
      else read.textContent = mode === 'live' ? 'Live: the world keeps its natural speed while the model thinks.' : mode === 'slow' ? 'Slowed: every clock runs 16× slower, so less changes per action.' : 'Paused: the world freezes until the model acts.';
    });
  },

  results(root) {
    const rows = [
      ['Human', 45, null, 'human'], ['GPT-6 Astra (xHigh)', 9, 66], ['GPT-6 Astra (Low)', 8, 58], ['Claude Opus 5.5 (xHigh)', 5, 57],
      ['GPT-6 Luna (xHigh)', 1, 17], ['Qwen3.8-27B', 1, 2], ['Qwen3.5-9B', 0, 1],
    ];
    root.append(h(`
      <div class="legend"><span><i style="background:#22d3ee"></i>Real time</span><span><i style="background:#a78bfa"></i>Non-real-time counterpart</span><span><i style="background:#34d399"></i>Human, real time</span></div>
      <div class="bars">${rows.map(([n, rt, nrt, kind], i) => `
        <div class="bar-row"><div class="name">${n}</div><div class="bar-track">
          <div class="bar-fill ${kind === 'human' ? 'human' : 'rt'}" data-w="${rt}" style="height:${nrt == null ? 100 : 50}%;transition-delay:${0.2 + i * 0.08}s">${rt < 15 ? '' : `${rt}%`}</div>
          ${rt < 15 ? `<span class="bar-out" style="left:calc(${Math.max(rt, 3)}% + 6px)">${rt}%</span>` : ''}
          ${nrt == null ? '' : `<div class="bar-fill nrt" data-w="${nrt}" style="transition-delay:${0.3 + i * 0.08}s">${nrt}%</div>`}
        </div></div>`).join('')}
      </div>
      <p class="readout" style="margin-top:1rem">Difficulty 5, full interaction, live setting. Human: one of the authors on 20 sampled real-time tasks, first try.</p>`));
    requestAnimationFrame(() => setTimeout(() => root.querySelectorAll('.bar-fill').forEach(b => { b.style.width = `${Math.max(Number(b.dataset.w), 3)}%`; }), 50));
  },

  slowdown(root) {
    const stops = [['1×', 9, 'Live'], ['4×', 17, '4× slower'], ['16×', 48, '16× slower'], ['64×', 57, '64× slower'], ['⏸', 75, 'Paused']];
    root.append(h(`
      <div class="slider-wrap">
        <div>
          <div class="bars" id="sd-bars">${stops.map(([l, v], i) => `<div class="bar-row" style="grid-template-columns:5rem 1fr"><div class="name">${l}</div><div class="bar-track"><div class="bar-fill rt" data-w="${v}" style="height:100%">${v}%</div></div></div>`).join('')}</div>
          <input type="range" id="sd" min="0" max="4" step="1" value="0" style="margin-top:1.2rem">
          <div class="ticks">${stops.map(s => `<span>${s[0]}</span>`).join('')}</div>
        </div>
        <div class="meter"><div class="val" id="sd-val">9%</div><p id="sd-lab">Live</p><p style="margin-top:.8rem">Human, live: <b style="color:var(--green)">45%</b><br>2.2 min per task vs 7.2 min for Astra</p></div>
      </div>`));
    const input = root.querySelector('#sd');
    let shown = 9;
    const set = () => {
      const k = Number(input.value);
      root.querySelectorAll('#sd-bars .bar-fill').forEach((b, i) => { b.style.width = i <= k ? `${b.dataset.w}%` : '0%'; b.style.opacity = i === k ? 1 : 0.45; });
      root.querySelector('#sd-lab').textContent = stops[k][2];
      const target = stops[k][1];
      const from = shown, t0 = performance.now();
      const anim = (now) => { const f = Math.min(1, (now - t0) / 500); shown = Math.round(from + (target - from) * f); root.querySelector('#sd-val').textContent = `${shown}%`; if (f < 1) requestAnimationFrame(anim); };
      requestAnimationFrame(anim);
    };
    input.oninput = set;
    setTimeout(set, 100);
    let auto = setInterval(() => { input.value = (Number(input.value) + 1) % 5; set(); }, 1400);
    const stop = () => clearInterval(auto);
    input.addEventListener('pointerdown', stop);
    cleanup.push(stop);
  },

  code(root) {
    const rows = [['GPT-6 Astra (xHigh)', 9, 31], ['GPT-6 Astra (Low)', 8, 14], ['GPT-6 Luna (xHigh)', 1, 5]];
    root.append(h(`
      <div class="row two">
        <div>
          <div class="legend"><span><i style="background:rgba(34,211,238,.35)"></i>Without code</span><span><i style="background:#22d3ee"></i>With code</span></div>
          <div class="bars">${rows.map(([n, a, b], i) => `
            <div class="bar-row" style="grid-template-columns:9.5rem 1fr"><div class="name">${n}</div><div class="bar-track">
              <div class="bar-fill rt" data-w="${b}" style="height:100%;transition-delay:${0.6 + i * 0.1}s">${b}%</div>
              <div class="bar-fill" data-w="${a}" style="height:100%;background:rgba(34,211,238,.35);color:#cfe;transition-delay:${0.2 + i * 0.1}s">${a}%</div>
            </div></div>`).join('')}</div>
        </div>
        <div class="tile" ${delay(1)} style="font-family:var(--font-mono);font-size:.82rem;line-height:1.7;color:#cbd5e1">
          <div class="k" style="margin-bottom:.5rem">What Astra's script does</div>
          <span style="color:#a78bfa">while</span> not done:<br>
          &nbsp;&nbsp;frame = <span style="color:#22d3ee">screenshot</span>()<br>
          &nbsp;&nbsp;key = <span style="color:#22d3ee">match_template</span>(frame, next_char)<br>
          &nbsp;&nbsp;<span style="color:#22d3ee">click</span>(key.center) &nbsp;<span style="color:#6c7386"># within 200 ms</span>
        </div>
      </div>`));
    requestAnimationFrame(() => setTimeout(() => root.querySelectorAll('.bar-fill').forEach(b => { b.style.width = `${Math.max(Number(b.dataset.w), 3)}%`; }), 50));
  },

  doomed(root) {
    const rungs = [
      ['Live, as it is today', 'The world keeps moving while it thinks', 9, '#f87171'],
      ['Live, writing code', 'Its scripts act within 200 ms', 31, '#a78bfa'],
      ['World 64× slower', 'Every clock in the game runs 64× slower', 57, '#fbbf24'],
      ['Paused', 'The world waits for every action', 75, '#22d3ee'],
    ];
    root.append(h(`
      <div class="legend"><span>GPT-6 Astra (xHigh), same 100 real-time tasks</span><span><i style="background:none;border:2px dashed #fff;border-radius:2px"></i>Human, live: 45%</span></div>
      <div class="bars">${rungs.map(([n, d, v, c], i) => `
        <div class="bar-row" style="grid-template-columns:13rem 1fr"><div class="name">${n}<small style="display:block;font-family:var(--font-body);font-weight:400;font-size:.78rem;color:var(--muted)">${d}</small></div>
          <div class="bar-track" style="height:34px;overflow:visible">
            <div class="bar-fill" data-w="${v}" style="height:100%;background:linear-gradient(90deg, color-mix(in srgb, ${c} 45%, #000), ${c});transition-delay:${0.3 + i * 0.35}s">${v < 15 ? '' : `${v}%`}</div>
            ${v < 15 ? `<span class="bar-out" style="height:100%;left:calc(${v}% + 6px);color:${c}">${v}%</span>` : ''}
            <div style="position:absolute;top:-4px;bottom:-4px;left:45%;border-left:2px dashed rgba(255,255,255,.75)"></div>
          </div></div>`).join('')}
      </div>
      <div class="row three" style="margin-top:1.4rem">
        <div class="tile" ${delay(5)}><div class="emoji">💻</div><div class="k" style="margin-top:.5rem">Write code</div><p>The model decides what to do, and its scripts react in real time.</p></div>
        <div class="tile" ${delay(6)}><div class="emoji">⚡</div><div class="k" style="margin-top:.5rem">Faster models</div><p>More time per action recovers most of the gap.</p></div>
        <div class="tile" ${delay(7)}><div class="emoji">🏋️</div><div class="k" style="margin-top:.5rem">Train in real time</div><p>All 100 minigames and their generators are released to train on.</p></div>
      </div>`));
    requestAnimationFrame(() => setTimeout(() => root.querySelectorAll('.bar-fill').forEach(b => { b.style.width = `${b.dataset.w}%`; }), 50));
  },

  examples(root) {
    const ex = [
      ['rotating_keyboard', 'Rotating On-Screen Keyboard', 'Solved in 45 s', 'Failed after 14 min'],
      ['concertina_courier', 'Concertina Courier', 'Solved in 16 s', 'Failed after 17 min'],
      ['impossible_ecology', 'Impossible Ecology', 'Solved in 45 s', 'Failed after 19 min'],
    ];
    root.append(h(`
      <div class="seg" id="ex-tabs" style="margin-bottom:1rem">${ex.map((e, i) => `<button data-i="${i}" class="${i ? '' : 'on'}">${e[1]}</button>`).join('')}</div>
      <div class="vs">
        <div><div class="who">🧑 Human <span class="win" id="ex-h"></span></div><video class="clip" id="ex-hv" muted loop autoplay playsinline></video></div>
        <div><div class="who">🤖 GPT-6 Astra (xHigh) <span class="lose" id="ex-m"></span></div><video class="clip" id="ex-mv" muted loop autoplay playsinline></video></div>
      </div>`));
    const show = (i) => {
      const [k, , hs, ms] = ex[i];
      root.querySelector('#ex-h').textContent = hs; root.querySelector('#ex-m').textContent = ms;
      root.querySelector('#ex-hv').src = `../assets/examples/human_${k}.mp4`;
      root.querySelector('#ex-mv').src = `../assets/examples/astra_${k}.mp4`;
      root.querySelectorAll('#ex-tabs button').forEach((b, j) => b.classList.toggle('on', j === i));
    };
    root.querySelectorAll('#ex-tabs button').forEach(b => b.onclick = () => show(Number(b.dataset.i)));
    show(0);
  },

  play(root) {
    const games = ['rotating_keyboard_v2_env', 'three_camera_claw_machine_v2_env', 'courtesy_junction_env', 'tiny_fps_customs_v2_env', 'slot_reel_capture_env', 'bomb_manual_from_hell_v2_env'];
    root.append(h(`
      <div class="mosaic">${games.map((g, i) => `<a href="../arcade/#${g}"><video class="tile" ${delay(i)} src="../arcade/media/${g}.mp4" poster="../arcade/media/${g}.jpg" muted loop autoplay playsinline></video></a>`).join('')}</div>
      <a class="cta" href="../arcade/">🕹️ Open the arcade</a>`));
  },
};

// Deep link to a question, for example explore/#results.
const initial = location.hash.slice(1);
if (Q[initial]) setTimeout(() => open(initial), 300);
renderCrumbs();
</script>

        async src="//gc.zgo.at/count.js"></script>
