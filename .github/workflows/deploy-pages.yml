name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['website/**', 'benchmarks/gym_anything_rt/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble deploy directory
        run: |
          mkdir -p _site
          rsync -a --exclude build_play.py website/ _site/
          touch _site/.nojekyll

      - name: Export the playable minigames
        run: python website/build_play.py --output _site/play

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
